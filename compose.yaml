services:
    app:
        build:
            context: .
            target: development
        ports:
            - '8000:8000'
        environment:
            APP_ENV: dev
            APP_DEBUG: '1'
            APP_TIMEZONE: Asia/Tokyo
            CLOUD_MODE: '1'
            AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY-}
            REQUEST_ID_HEADER: ${REQUEST_ID_HEADER:-X-Request-ID}
            REQUEST_ID_TRUSTED_PROXIES: ${REQUEST_ID_TRUSTED_PROXIES-}
            SYMFONY_TRUSTED_PROXIES: ${SYMFONY_TRUSTED_PROXIES-}
            VALKEY_URL: redis://valkey:6379
            ARCHIVE_S3_ENDPOINT: http://minio:9000
            ARCHIVE_S3_REGION: us-east-1
            ARCHIVE_S3_BUCKET: ${MINIO_BUCKET:-bbs-archive}
            ARCHIVE_S3_PREFIX: ${ARCHIVE_S3_PREFIX-archives}
            ARCHIVE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
            ARCHIVE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
            ARCHIVE_S3_PATH_STYLE: '1'
        volumes:
            - .:/app
            - vendor:/app/vendor

    valkey:
        image: valkey/valkey:8-alpine
        command:
            - valkey-server
            - --appendonly
            - 'yes'
            - --appendfsync
            - everysec
            - --maxmemory-policy
            - noeviction
        ports:
            - '6379:6379'
        volumes:
            - valkey_data:/data
        healthcheck:
            test: ['CMD', 'valkey-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 5

    minio:
        image: minio/minio:latest
        command: server /data --console-address ':9001'
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
        ports:
            - '9000:9000'
            - '9001:9001'
        volumes:
            - minio_data:/data
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
            interval: 5s
            timeout: 3s
            retries: 10

    minio-init:
        image: minio/mc:latest
        depends_on:
            minio:
                condition: service_healthy
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
            MINIO_BUCKET: ${MINIO_BUCKET:-bbs-archive}
        entrypoint: ['/bin/sh', '-c']
        command:
            - >-
                mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
                mc mb --ignore-existing "local/$${MINIO_BUCKET}"

    vite:
        build:
            context: .
            dockerfile: Dockerfile.vite
        ports:
            - '5173:5173'
        volumes:
            - .:/app
            - node_modules:/app/node_modules

volumes:
    minio_data:
    node_modules:
    valkey_data:
    vendor:
