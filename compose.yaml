services:
    app:
        build:
            context: .
            target: development
        ports:
            - '8000:8000'
        environment:
            APP_ENV: dev
            APP_DEBUG: '1'
            APP_TIMEZONE: Asia/Tokyo
            VALKEY_URL: redis://valkey:6379
        volumes:
            - .:/app
            - vendor:/app/vendor

    valkey:
        image: valkey/valkey:8-alpine
        command:
            - valkey-server
            - --appendonly
            - 'yes'
            - --appendfsync
            - everysec
            - --maxmemory-policy
            - noeviction
        ports:
            - '6379:6379'
        volumes:
            - valkey_data:/data
        healthcheck:
            test: ['CMD', 'valkey-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 5

    vite:
        build:
            context: .
            dockerfile: Dockerfile.vite
        ports:
            - '5173:5173'
        volumes:
            - .:/app
            - node_modules:/app/node_modules

volumes:
    node_modules:
    valkey_data:
    vendor:
