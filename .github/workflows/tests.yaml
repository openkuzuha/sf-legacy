name: Tests

on:
    push:
    pull_request:

permissions:
    contents: read

concurrency:
    group: tests-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Build development image
              run: docker compose build app

            - name: Run quality checks
              run: >-
                  docker compose run --rm
                  -e APP_ENV=test
                  -e APP_DEBUG=1
                  -e AUDIT_HMAC_KEY=YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
                  app composer check
