framework:
    secret: '%env(APP_SECRET)%'
    trusted_proxies: '%env(SYMFONY_TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']
    session: true
    csrf_protection: true
    rate_limiter:
        admin_login:
            policy: sliding_window
            limit: 5
            interval: '1 minute'
        post_short:
            policy: sliding_window
            limit: 2
            interval: '10 seconds'
        post_hourly:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
        post:
            policy: compound
            limiters:
                - post_short
                - post_hourly
        post_duplicate:
            policy: sliding_window
            limit: 1
            interval: '3 minutes'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
