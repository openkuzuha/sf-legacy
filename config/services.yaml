parameters:
    app.title: '%env(APP_TITLE)%'
    app.timezone: '%env(APP_TIMEZONE)%'
    app.visitor_limit: 300

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $appTimezone: '%app.timezone%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Post\PostRepository:
        factory: ['@App\Post\PostRepositoryFactory', 'create']

    App\Visitor\VisitorCounter:
        arguments:
            $filename: '%kernel.cache_dir%/visitors.json'
            $limit: '%app.visitor_limit%'
